name: CI

# Manual only (owner, 2026-10-28: the account's free Actions minutes are used up; pushes must not start runs).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Tests that need the installed stock app skip here; the login-keychain test is opt-in and skips too.
      - name: Test (real modules)
        run: npm test
        env:
          CODEXMODS_REAL_MODULES: "1"
      - name: Test (test doubles)
        run: npm test
        env:
          CODEXMODS_REAL_MODULES: "0"
